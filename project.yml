# XcodeGen spec. CI runs `xcodegen generate` to create Peugeot408.xcodeproj (never committed).
name: Peugeot408

options:
  bundleIdPrefix: com.namazee88
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # ---- Change these in one place --------------------------------------
    APP_DISPLAY_NAME: Peugeot408          # home-screen / CarPlay label
    BUNDLE_PREFIX: com.namazee88          # App ID = $(BUNDLE_PREFIX).peugeot408
    DEVELOPMENT_TEAM: YCS7MW628Y          # CI can override with the TEAM_ID secret
    APP_GROUP_ID: group.$(BUNDLE_PREFIX).peugeot408
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"          # CI sets this from the GitHub run number
    # ----------------------------------------------------------------------
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CarKit:
    type: framework
    platform: iOS
    sources: [CarKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).peugeot408.carkit
        TARGETED_DEVICE_FAMILY: "1"
        MACH_O_TYPE: staticlib            # linked into app + widgets, nothing to embed or sign
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO

  Peugeot408:
    type: application
    platform: iOS
    sources: [Peugeot408]
    dependencies:
      - target: CarKit
        embed: false
      - target: Peugeot408Widgets
    info:
      path: Peugeot408/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [peugeot408]
    entitlements:
      path: Peugeot408/Peugeot408.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).peugeot408
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only (XcodeGen's target default is 1,2)

  Peugeot408Widgets:
    type: app-extension
    platform: iOS
    sources: [Peugeot408Widgets]
    dependencies:
      - target: CarKit
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Peugeot408Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Peugeot408Widgets/Peugeot408Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).peugeot408.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  CarKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CarKitTests]
    dependencies:
      - target: CarKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).peugeot408.carkittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Peugeot408:
    build:
      targets:
        Peugeot408: all
        Peugeot408Widgets: all
    run:
      config: Debug
    archive:
      config: Release
  CarKit:
    build:
      targets:
        CarKit: all
        CarKitTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CarKitTests
